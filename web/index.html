<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HALFLIGHT</title>
<style>
  :root {
    --bg: #0b0d0e; --panel: #121517; --edge: #23282b;
    --ink: #c8cdd0; --dim: #6f797e; --amber: #d8a657; --blood: #a4453b;
    --ok: #7a9e6e; --cyan: #6fb3b8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.6 "Consolas", "SF Mono", ui-monospace, monospace;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
    padding: .5rem .9rem; background: var(--panel); border-bottom: 1px solid var(--edge);
  }
  header .title { color: var(--amber); letter-spacing: .28em; font-weight: 700; }
  .stat { color: var(--dim); }
  .stat b { color: var(--ink); font-weight: 600; }
  #hp.low b { color: var(--blood); }
  #loc { color: var(--cyan); }
  .spacer { margin-left: auto; }
  button {
    background: transparent; border: 1px solid var(--edge); color: var(--amber);
    font: inherit; padding: .4rem .8rem; border-radius: 3px; cursor: pointer;
  }
  button:hover { border-color: var(--amber); }
  button:disabled { color: var(--dim); border-color: var(--edge); cursor: default; }
  input[type=text], select {
    background: #0e1113; border: 1px solid var(--edge); color: var(--ink);
    font: inherit; padding: .5rem .6rem; border-radius: 3px; outline: none;
  }
  input[type=text]:focus, select:focus { border-color: var(--amber); }

  /* Start screen overlay */
  #start-screen {
    position: fixed; inset: 0; background: var(--bg); z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem;
  }
  #start-screen.hidden { display: none; }
  #start-screen h1 { color: var(--amber); letter-spacing: .4em; font-size: 1.6rem; margin: 0 0 1rem; }
  #start-screen .tagline { color: var(--dim); font-style: italic; margin-top: -.8rem; margin-bottom: 1rem; }
  .field { display: flex; flex-direction: column; gap: .3rem; width: 280px; }
  .field label { color: var(--dim); font-size: 12px; letter-spacing: .15em; }
  #begin { width: 280px; padding: .6rem; margin-top: .5rem; }

  /* Character sheet */
  #sheet {
    display: none; background: #0e1113; border-bottom: 1px solid var(--edge);
    padding: .8rem 1.1rem; gap: 2rem; max-width: 820px; width: 100%; margin: 0 auto;
    flex-wrap: wrap; max-height: 45vh; overflow-y: auto;
  }
  #sheet.open { display: flex; }
  .sheet-col { flex: 1; min-width: 190px; }
  .sheet-col h3 { color: var(--cyan); font-size: 12px; letter-spacing: .2em; margin: 0 0 .5rem; }
  .sub { color: var(--dim); font-size: 11px; letter-spacing: .15em; margin: .6rem 0 .2rem; }
  .row { display: flex; justify-content: space-between; gap: 1rem; padding: .1rem 0; }
  .row .k { color: var(--ink); } .row .v { color: var(--dim); }
  .row .v.neg { color: var(--blood); } .row .v.pos { color: var(--ok); }
  .empty { color: var(--dim); font-style: italic; }

  main {
    flex: 1; overflow-y: auto; padding: 1rem 1.1rem; max-width: 820px; width: 100%;
    margin: 0 auto; white-space: pre-wrap; word-wrap: break-word;
  }
  .sys { color: var(--dim); font-style: italic; }
  .you { color: var(--amber); }
  .you::before { content: "> "; color: var(--dim); }
  .narr { color: var(--ink); margin: .3rem 0 1rem; }
  .correction { color: var(--blood); font-style: italic; }
  .dead { color: var(--blood); font-weight: 700; }
  .thinking { color: var(--dim); font-style: italic; }
  footer { border-top: 1px solid var(--edge); background: var(--panel); padding: .5rem .9rem; }
  form { display: flex; gap: .6rem; max-width: 820px; margin: 0 auto; }
  form input[type=text] { flex: 1; }
</style>
</head>
<body>
  <div id="start-screen">
    <h1>HALFLIGHT</h1>
    <div class="tagline">The halflight never changes. People do the changing.</div>
    <div class="field">
      <label for="name">NAME</label>
      <input id="name" type="text" value="Drifter" />
    </div>
    <div class="field">
      <label for="start">BEGIN AT</label>
      <select id="start"></select>
    </div>
    <button id="begin">enter the halflight</button>
    <div id="start-msg" class="sys"></div>
  </div>

  <header>
    <span class="title">HALFLIGHT</span>
    <span class="stat" id="loc">—</span>
    <span class="stat" id="hp">HP <b>—</b></span>
    <span class="stat">SCRIP <b id="scrip">—</b></span>
    <span class="stat">T<b id="time">—</b></span>
    <button id="sheetBtn" class="spacer">sheet</button>
    <button id="newBtn">new</button>
  </header>

  <section id="sheet">
    <div class="sheet-col">
      <h3>STATUS</h3><div id="sheet-status"></div>
      <h3 style="margin-top:1rem">STATS</h3><div id="sheet-stats"></div>
    </div>
    <div class="sheet-col">
      <h3>SURROUNDINGS</h3><div id="sheet-here"></div>
    </div>
    <div class="sheet-col">
      <h3>INVENTORY</h3><div id="sheet-inv"></div>
    </div>
  </section>

  <main id="log"></main>

  <footer>
    <form id="form">
      <input id="input" type="text" autocomplete="off" placeholder="what do you do?" disabled />
      <button id="send" disabled>act</button>
    </form>
  </footer>

<script>
const log = document.getElementById('log');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const startScreen = document.getElementById('start-screen');
let runId = null, busy = false;

function scroll() { log.scrollTop = log.scrollHeight; }
function el(cls, text) {
  const d = document.createElement('div');
  d.className = cls; if (text !== undefined) d.textContent = text;
  log.appendChild(d); scroll(); return d;
}
function sys(t) { el('sys', t); }
function row(k, v, cls) {
  return `<div class="row"><span class="k">${k}</span><span class="v ${cls||''}">${v}</span></div>`;
}

function renderState(s) {
  document.getElementById('loc').textContent = s.location_name || s.location_id;
  const hp = document.getElementById('hp');
  hp.querySelector('b').textContent = s.hp;
  hp.classList.toggle('low', s.hp <= 5);
  document.getElementById('scrip').textContent = s.credits;
  document.getElementById('time').textContent = s.time_ticks;

  document.getElementById('sheet-status').innerHTML =
    row('HP', s.hp) + row('Credits', s.credits + ' cr') +
    row('Location', s.location_name || s.location_id) + row('Turn', s.time_ticks);

  const order = ['muscle','nerve','wits','tech','streetwise','presence'];
  const stats = s.stats || {};
  document.getElementById('sheet-stats').innerHTML =
    order.filter(k => k in stats).map(k => row(k, stats[k])).join('') || '<div class="empty">—</div>';

  const exits = (s.exits || []).map(e => row(e.name || e.id, 'go')).join('') || '<div class="empty">none</div>';
  const npcs = (s.npcs || []).map(n => {
    const d = n.disposition, cls = d < 0 ? 'neg' : (d > 0 ? 'pos' : '');
    return row((n.name || n.id) + (n.alive ? '' : ' (dead)'), (d>0?'+':'') + d, cls);
  }).join('') || '<div class="empty">no one here</div>';
  document.getElementById('sheet-here').innerHTML =
    '<div class="sub">EXITS</div>' + exits + '<div class="sub">PEOPLE HERE</div>' + npcs;

  const inv = (s.inventory || []).map(i =>
    row(i.name + (i.quantity > 1 ? ' ×'+i.quantity : ''), i.kind)).join('');
  document.getElementById('sheet-inv').innerHTML = inv || '<div class="empty">empty</div>';

  if (s.ended) {
    el('dead', '— ' + (s.cause_of_death || 'you died') + ' —');
    setEnabled(false); runId = null; localStorage.removeItem('hl_run');
    setTimeout(showStart, 400);
  }
}

function setEnabled(on) { input.disabled = !on; sendBtn.disabled = !on; if (on) input.focus(); }

async function showStart() {
  startScreen.classList.remove('hidden');
  const sel = document.getElementById('start');
  if (!sel.options.length) {
    try {
      const r = await fetch('/locations');
      const locs = r.ok ? await r.json() : [];
      sel.innerHTML = locs.map(l => `<option value="${l.id}">${l.name}</option>`).join('');
      const saltgate = locs.find(l => l.id === 'loc_saltgate');
      if (saltgate) sel.value = 'loc_saltgate';
      if (!locs.length) document.getElementById('start-msg').textContent = 'No world ingested. Run the ingest command.';
    } catch (e) { document.getElementById('start-msg').textContent = 'Could not reach the server.'; }
  }
}

async function newGame() {
  const body = {
    character_name: document.getElementById('name').value || 'Drifter',
    start_location: document.getElementById('start').value,
  };
  if (!body.start_location) { document.getElementById('start-msg').textContent = 'Pick a start location.'; return; }
  const r = await fetch('/runs', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  if (!r.ok) { document.getElementById('start-msg').textContent = 'Could not start: ' + r.status; return; }
  const s = await r.json();
  runId = s.run_id; localStorage.setItem('hl_run', runId);
  startScreen.classList.add('hidden');
  log.innerHTML = '';
  sys('You came to in ' + (s.location_name || s.location_id) + '. The halflight did not change.');
  renderState(s); setEnabled(true);
}

async function loadState(id) {
  const r = await fetch('/state?run_id=' + id);
  if (!r.ok) return false;
  const s = await r.json();
  runId = id; startScreen.classList.add('hidden');
  renderState(s); setEnabled(!s.ended);
  sys('(resumed — ' + (s.location_name || s.location_id) + ')');
  return true;
}

async function act(text) {
  if (busy || !runId) return;
  busy = true; setEnabled(false);
  el('you', text);
  const thinking = el('thinking', '…');
  const narr = el('narr', '');
  let started = false;
  try {
    const resp = await fetch('/turn', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({run_id: runId, text})});
    if (!resp.ok) {
      thinking.remove();
      let msg = 'error ' + resp.status;
      try { const j = await resp.json(); if (j.detail) msg = j.detail; } catch (e) {}
      narr.className = 'correction'; narr.textContent = '[ ' + msg + ' ]';
      return;
    }
    const reader = resp.body.getReader(); const dec = new TextDecoder(); let buf = '';
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream:true});
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        if (!started) { thinking.remove(); started = true; }
        handleFrame(buf.slice(0, i), narr); buf = buf.slice(i + 2);
      }
    }
  } catch (e) { narr.textContent += '\n[connection lost]'; }
  finally { thinking.remove(); busy = false; if (runId) setEnabled(true); }
}

function handleFrame(frame, narr) {
  let event = 'message', data = '';
  for (const line of frame.split('\n')) {
    if (line.startsWith('event:')) event = line.slice(6).trim();
    else if (line.startsWith('data:')) data = line.slice(5).trim();
  }
  const p = data ? JSON.parse(data) : {};
  if (event === 'token') { narr.textContent += p.text; scroll(); }
  else if (event === 'correction') el('correction', p.text);
  else if (event === 'state') renderState(p);
}

document.getElementById('begin').addEventListener('click', newGame);
document.getElementById('newBtn').addEventListener('click', showStart);
document.getElementById('sheetBtn').addEventListener('click', () =>
  document.getElementById('sheet').classList.toggle('open'));
document.getElementById('form').addEventListener('submit', (e) => {
  e.preventDefault();
  const t = input.value.trim();
  if (t) { input.value = ''; act(t); }
});

const saved = localStorage.getItem('hl_run');
if (saved) { loadState(saved).then(ok => { if (!ok) showStart(); }); }
else showStart();
</script>
</body>
</html>
