<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HALFLIGHT</title>
<style>
  :root {
    --bg: #0b0d0e; --panel: #121517; --edge: #23282b;
    --ink: #c8cdd0; --dim: #6f797e; --amber: #d8a657; --blood: #a4453b;
    --ok: #7a9e6e; --cyan: #6fb3b8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.6 "Consolas", "SF Mono", ui-monospace, monospace;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
    padding: .5rem .9rem; background: var(--panel); border-bottom: 1px solid var(--edge);
  }
  header .title { color: var(--amber); letter-spacing: .28em; font-weight: 700; }
  .stat { color: var(--dim); }
  .stat b { color: var(--ink); font-weight: 600; }
  #hp.low b { color: var(--blood); }
  #heat.hot b { color: var(--blood); }
  #heat.warm b { color: var(--amber); }
  #shift.curfew b { color: var(--amber); }
  #loc { color: var(--cyan); }
  .spacer { margin-left: auto; }
  button {
    background: transparent; border: 1px solid var(--edge); color: var(--amber);
    font: inherit; padding: .4rem .8rem; border-radius: 3px; cursor: pointer;
  }
  button:hover { border-color: var(--amber); }
  button:disabled { color: var(--dim); border-color: var(--edge); cursor: default; }
  input[type=text] {
    background: #0e1113; border: 1px solid var(--edge); color: var(--ink);
    font: inherit; padding: .5rem .6rem; border-radius: 3px; outline: none;
  }
  input[type=text]:focus { border-color: var(--amber); }

  /* Character creator */
  #creator { position: fixed; inset: 0; background: var(--bg); z-index: 10; overflow-y: auto; padding: 2rem 1rem; }
  #creator.hidden { display: none; }
  #cg-inner { max-width: 760px; margin: 0 auto; }
  #cg-inner h1 { color: var(--amber); letter-spacing: .42em; text-align: center; font-size: 1.5rem; margin: 0 0 .2rem; }
  #cg-progress { color: var(--cyan); letter-spacing: .2em; font-size: 12px; text-align: center; margin-bottom: 1.3rem; }
  .cg-prompt { color: var(--ink); text-align: center; margin-bottom: 1rem; font-size: 1.05rem; }
  .cg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; }
  .cg-card { text-align: left; background: var(--panel); border: 1px solid var(--edge);
    border-radius: 4px; padding: .8rem; cursor: pointer; color: var(--ink); font: inherit; }
  .cg-card:hover { border-color: var(--amber); background: #161a1c; }
  .cg-card-title { color: var(--amber); font-weight: 700; margin-bottom: .3rem; }
  .cg-card-stats { color: var(--cyan); font-size: 12px; }
  .cg-card-items { color: var(--dim); font-size: 12px; margin: .2rem 0; }
  .cg-card-blurb { color: var(--ink); font-size: 13px; margin-top: .3rem; }
  .cg-card-hint { color: var(--ok); font-size: 12px; margin-top: .4rem; letter-spacing: .05em; }
  .cg-name { display: flex; flex-direction: column; gap: .3rem; max-width: 280px; margin: 0 auto 1.3rem; }
  .cg-name label { color: var(--dim); font-size: 12px; letter-spacing: .15em; }
  .cg-recap-step { border-left: 2px solid var(--edge); padding: .3rem 0 .6rem .8rem; margin-bottom: .6rem; }
  .cg-recap-head { color: var(--amber); }
  .cg-recap-text { color: var(--ink); font-size: 13px; margin: .2rem 0; }
  .cg-recap-sum { color: var(--dim); font-size: 12px; }
  .cg-recap-sum.pos { color: var(--ok); } .cg-recap-sum.neg { color: var(--blood); }
  .cg-final { text-align: center; color: var(--cyan); margin: 1rem 0; font-size: 13px; }
  #cg-begin { display: block; margin: 1rem auto 0; padding: .6rem 1.3rem; }
  .empty { color: var(--dim); font-style: italic; text-align: center; }
  @media (max-width: 600px) { .cg-grid { grid-template-columns: 1fr; } }

  /* Character sheet */
  #sheet { display: none; background: #0e1113; border-bottom: 1px solid var(--edge);
    padding: .8rem 1.1rem; gap: 2rem; max-width: 820px; width: 100%; margin: 0 auto;
    flex-wrap: wrap; max-height: 45vh; overflow-y: auto; }
  #sheet.open { display: flex; }
  .sheet-col { flex: 1; min-width: 190px; }
  .sheet-col h3 { color: var(--cyan); font-size: 12px; letter-spacing: .2em; margin: 0 0 .5rem; }
  .sub { color: var(--dim); font-size: 11px; letter-spacing: .15em; margin: .6rem 0 .2rem; }
  .origin { color: var(--fg); font-size: 12px; line-height: 1.5; }
  .row { display: flex; justify-content: space-between; gap: 1rem; padding: .1rem 0; }
  .row .k { color: var(--ink); } .row .v { color: var(--dim); }
  .row .v.neg { color: var(--blood); } .row .v.pos { color: var(--ok); }

  main { flex: 1; overflow-y: auto; padding: 1rem 1.1rem; max-width: 820px; width: 100%;
    margin: 0 auto; white-space: pre-wrap; word-wrap: break-word; }
  .sys { color: var(--dim); font-style: italic; }
  .you { color: var(--amber); } .you::before { content: "> "; color: var(--dim); }
  .narr { color: var(--ink); margin: .3rem 0 1rem; }
  .correction { color: var(--blood); font-style: italic; }
  .dead { color: var(--blood); font-weight: 700; }
  .death-card { border: 1px solid var(--blood); border-radius: 4px; padding: 1rem 1.2rem;
    margin: 1rem 0; text-align: center; background: rgba(180,40,40,.06); }
  .death-card .dead { font-size: 15px; letter-spacing: .1em; margin-bottom: .5rem; }
  .death-sub { color: var(--fg); font-size: 13px; margin-bottom: .4rem; }
  .death-standing { color: var(--dim); font-size: 12px; margin-bottom: .8rem; }
  .death-standing .v { margin: 0 .3rem; }
  #reborn { background: var(--blood); color: #fff; border: none; border-radius: 3px;
    padding: .5rem 1.4rem; font-family: inherit; font-size: 12px; letter-spacing: .1em;
    cursor: pointer; }
  #reborn:hover { filter: brightness(1.15); }
  .thinking { color: var(--dim); font-style: italic; }
  footer { border-top: 1px solid var(--edge); background: var(--panel); padding: .5rem .9rem; }
  form { display: flex; gap: .6rem; max-width: 820px; margin: 0 auto; }
  form input[type=text] { flex: 1; }
</style>
</head>
<body>
  <div id="creator">
    <div id="cg-inner">
      <h1>HALFLIGHT</h1>
      <div id="cg-progress"></div>
      <div id="cg-body"></div>
    </div>
  </div>

  <header>
    <span class="title">HALFLIGHT</span>
    <span class="stat" id="loc">—</span>
    <span class="stat" id="hp">HP <b>—</b></span>
    <span class="stat">SCRIP <b id="scrip">—</b></span>
    <span class="stat" id="shift"><b>—</b></span>
    <span class="stat" id="heat">HEAT <b>—</b></span>
    <button id="sheetBtn" class="spacer">sheet</button>
    <button id="newBtn">new</button>
  </header>

  <section id="sheet">
    <div class="sheet-col">
      <h3>STATUS</h3><div id="sheet-status"></div>
      <h3 style="margin-top:1rem">STATS</h3><div id="sheet-stats"></div>
    </div>
    <div class="sheet-col"><h3>SURROUNDINGS</h3><div id="sheet-here"></div></div>
    <div class="sheet-col">
      <h3>INVENTORY</h3><div id="sheet-inv"></div>
      <h3 style="margin-top:1rem">ORIGIN</h3><div id="sheet-origin"></div>
    </div>
  </section>

  <main id="log"></main>

  <footer>
    <form id="form">
      <input id="input" type="text" autocomplete="off" placeholder="what do you do?" disabled />
      <button id="send" disabled>act</button>
    </form>
  </footer>

<script>
const log = document.getElementById('log');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const creator = document.getElementById('creator');
const cgBody = document.getElementById('cg-body');
const cgProg = document.getElementById('cg-progress');
let runId = null, busy = false;
let CG = null, build = { name:'Drifter', classId:null, choices:{} }, stepIx = 0;

function scroll() { log.scrollTop = log.scrollHeight; }
function el(cls, text) { const d = document.createElement('div'); d.className = cls;
  if (text !== undefined) d.textContent = text; log.appendChild(d); scroll(); return d; }
function sys(t) { el('sys', t); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function row(k, v, cls) { return `<div class="row"><span class="k">${k}</span><span class="v ${cls||''}">${v}</span></div>`; }

/* ---------- character creator ---------- */
async function openCreator() {
  creator.classList.remove('hidden');
  if (!CG) { try { const r = await fetch('/chargen'); CG = r.ok ? await r.json() : null; } catch(e){} }
  if (!CG || !CG.classes.length) { cgProg.textContent=''; cgBody.innerHTML = '<div class="empty">No world ingested — run the ingest command, then reload.</div>'; return; }
  build = { name:'Drifter', classId:null, choices:{} }; stepIx = 0;
  renderClasses();
}

function renderClasses() {
  cgProg.textContent = 'CHOOSE YOUR PATH';
  let h = `<div class="cg-name"><label for="cg-name-input">NAME</label>
    <input id="cg-name-input" type="text" value="${esc(build.name)}"></div><div class="cg-grid">`;
  for (const c of CG.classes) {
    h += `<div class="cg-card" data-cid="${c.id}">
      <div class="cg-card-title">${esc(c.name)}</div>
      <div class="cg-card-stats">HP ${c.hp} · ${c.credits} scrip</div>
      <div class="cg-card-items">${c.items.map(esc).join(', ')}</div>
      <div class="cg-card-blurb">${esc(c.blurb)}</div></div>`;
  }
  cgBody.innerHTML = h + '</div>';
  cgBody.querySelectorAll('.cg-card').forEach(elm => elm.addEventListener('click', () => {
    build.name = document.getElementById('cg-name-input').value || 'Drifter';
    build.classId = elm.dataset.cid; stepIx = 0; renderStep();
  }));
}

function renderStep() {
  const step = CG.steps[stepIx];
  cgProg.textContent = `${stepIx+1} / ${CG.steps.length}  ·  ${step.title}`;
  let h = `<div class="cg-prompt">${esc(step.prompt)}</div><div class="cg-grid">`;
  for (const o of step.options) {
    const hint = o.hint || (step.rolls ? 'the dice decide' : '');
    h += `<div class="cg-card" data-oid="${o.id}">
      <div class="cg-card-title">${esc(o.name)}</div>
      <div class="cg-card-blurb">${esc(o.blurb)}</div>
      <div class="cg-card-hint">${esc(hint)}</div></div>`;
  }
  cgBody.innerHTML = h + '</div>';
  cgBody.querySelectorAll('.cg-card').forEach(elm => elm.addEventListener('click', () => {
    build.choices[step.id] = elm.dataset.oid; stepIx++;
    if (stepIx >= CG.steps.length) finishChargen(); else renderStep();
  }));
}

async function finishChargen() {
  cgProg.textContent = 'THE DICE FALL';
  cgBody.innerHTML = '<div class="empty">the dice turn…</div>';
  let result;
  try {
    const r = await fetch('/runs/chargen', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({character_name: build.name, class_id: build.classId, choices: build.choices})});
    if (!r.ok) { cgBody.innerHTML = '<div class="empty">could not start: ' + r.status + '</div>'; return; }
    result = await r.json();
  } catch (e) { cgBody.innerHTML = '<div class="empty">could not reach the server.</div>'; return; }
  renderRecap(result);
}

function renderRecap(result) {
  cgProg.textContent = 'YOUR STORY';
  const s = result.state;
  let h = '';
  for (const b of result.backstory) {
    const cls = b.outcome_kind === 'positive' ? 'pos' : (b.outcome_kind === 'negative' ? 'neg' : '');
    h += `<div class="cg-recap-step">
      <div class="cg-recap-head">${esc(b.step_title)} — <b>${esc(b.option_name)}</b></div>
      <div class="cg-recap-text">${esc(b.text)}</div>
      <div class="cg-recap-sum ${cls}">${esc(b.summary)}</div></div>`;
  }
  const order = ['muscle','nerve','wits','tech','streetwise','presence'];
  h += `<div class="cg-final">You end up in <b style="color:var(--amber)">${esc(s.location_name || s.location_id)}</b>.<br>` +
    `HP ${s.hp} · ${s.credits} scrip · ` + order.map(k => `${k} ${s.stats[k]}`).join(' · ') + '</div>';
  h += '<button id="cg-begin">enter the halflight</button>';
  cgBody.innerHTML = h;
  document.getElementById('cg-begin').addEventListener('click', () => enterGame(s));
}

function enterGame(s) {
  runId = s.run_id; localStorage.setItem('hl_run', runId);
  creator.classList.add('hidden');
  log.innerHTML = '';
  sys('You came to in ' + (s.location_name || s.location_id) + '. The halflight did not change.');
  renderState(s); setEnabled(true);
}

/* ---------- play ---------- */
function renderState(s) {
  document.getElementById('loc').textContent = s.location_name || s.location_id;
  const hp = document.getElementById('hp');
  hp.querySelector('b').textContent = s.hp + (s.hp_max ? '/' + s.hp_max : '');
  hp.classList.toggle('low', s.hp <= 5);
  document.getElementById('scrip').textContent = s.credits;
  const shift = document.getElementById('shift');
  shift.querySelector('b').textContent = (s.shift || '').toUpperCase();
  shift.classList.toggle('curfew', !!s.curfew);
  const heat = document.getElementById('heat');
  heat.querySelector('b').textContent = s.heat;
  heat.classList.toggle('hot', s.heat >= 8);
  heat.classList.toggle('warm', s.heat >= 4 && s.heat < 8);

  document.getElementById('sheet-status').innerHTML =
    row('HP', s.hp + (s.hp_max ? ' / ' + s.hp_max : '')) + row('Credits', s.credits + ' cr') + row('Heat', s.heat) +
    row('Location', s.location_name || s.location_id) +
    row('Shift', s.shift + (s.curfew ? ' (curfew)' : '')) + row('Turn', s.time_ticks);
  const order = ['muscle','nerve','wits','tech','streetwise','presence'];
  const stats = s.stats || {};
  document.getElementById('sheet-stats').innerHTML =
    order.filter(k => k in stats).map(k => row(k, stats[k])).join('') || '<div class="empty">—</div>';

  const exits = (s.exits||[]).map(e => row(e.name||e.id, 'go')).join('') || '<div class="empty">none</div>';
  const npcs = (s.npcs||[]).map(n => {
    const d = n.disposition, cls = d < 0 ? 'neg' : (d > 0 ? 'pos' : '');
    return row((n.name||n.id) + (n.alive ? '' : ' (dead)'), (d>0?'+':'') + d, cls);
  }).join('') || '<div class="empty">no one here</div>';
  const standing = (s.standing || []).map(f => {
    const cls = f.rep < 0 ? 'neg' : (f.rep > 0 ? 'pos' : '');
    return row(f.name, (f.rep > 0 ? '+' : '') + f.rep, cls);
  }).join('');
  document.getElementById('sheet-here').innerHTML =
    '<div class="sub">EXITS</div>' + exits +
    '<div class="sub">PEOPLE HERE</div>' + npcs +
    (standing ? '<div class="sub">STANDING</div>' + standing : '');

  const inv = (s.inventory||[]).map(i => row(i.name + (i.quantity>1 ? ' ×'+i.quantity : ''), i.kind)).join('');
  document.getElementById('sheet-inv').innerHTML = inv || '<div class="empty">empty</div>';
  document.getElementById('sheet-origin').innerHTML =
    s.origin ? '<div class="origin">' + s.origin + '</div>' : '<div class="empty">unknown</div>';

  if (s.ended) showDeath(s);
}

function showDeath(s) {
  setEnabled(false); runId = null; localStorage.removeItem('hl_run');
  if (document.getElementById('death-card')) return;  // only once
  const standing = (s.standing || [])
    .map(f => `<span class="v ${f.rep<0?'neg':(f.rep>0?'pos':'')}">${esc(f.name)} ${f.rep>0?'+':''}${f.rep}</span>`)
    .join('');
  const card = el('death-card');
  card.id = 'death-card';
  card.innerHTML =
    '<div class="dead">— ' + esc(s.cause_of_death || 'you died') + ' —</div>' +
    '<div class="death-sub">' + esc(s.character_name || 'You') +
      ' lasted ' + (s.time_ticks || 0) + ' turns, and fell in ' +
      esc(s.location_name || s.location_id || 'the dark') + '.</div>' +
    (standing ? '<div class="death-standing">They will remember: ' + standing + '</div>' : '') +
    '<button id="reborn">begin again</button>';
  document.getElementById('reborn').addEventListener('click', openCreator);
}

function setEnabled(on) { input.disabled = !on; sendBtn.disabled = !on; if (on) input.focus(); }

async function loadState(id) {
  const r = await fetch('/state?run_id=' + id);
  if (!r.ok) return false;
  const s = await r.json();
  runId = id; creator.classList.add('hidden'); renderState(s); setEnabled(!s.ended);
  await replayHistory(id);
  sys('(resumed — ' + (s.location_name || s.location_id) + ')');
  return true;
}

async function replayHistory(id) {
  try {
    const r = await fetch('/history?run_id=' + id);
    if (!r.ok) return;
    const h = await r.json();
    for (const t of (h.turns || [])) {
      if (t.player_text) el('you', t.player_text);
      if (t.narration) el('narr', t.narration);
    }
  } catch (e) {}
}

async function act(text) {
  if (busy || !runId) return;
  busy = true; setEnabled(false);
  el('you', text);
  const thinking = el('thinking', '…');
  const narr = el('narr', '');
  let started = false;
  try {
    const resp = await fetch('/turn', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({run_id: runId, text})});
    if (!resp.ok) {
      thinking.remove(); let msg = 'error ' + resp.status;
      try { const j = await resp.json(); if (j.detail) msg = j.detail; } catch (e) {}
      narr.className = 'correction'; narr.textContent = '[ ' + msg + ' ]'; return;
    }
    const reader = resp.body.getReader(); const dec = new TextDecoder(); let buf = '';
    while (true) {
      const {done, value} = await reader.read(); if (done) break;
      buf += dec.decode(value, {stream:true});
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        if (!started) { thinking.remove(); started = true; }
        handleFrame(buf.slice(0, i), narr); buf = buf.slice(i + 2);
      }
    }
  } catch (e) { narr.textContent += '\n[connection lost]'; }
  finally { thinking.remove(); busy = false; if (runId) setEnabled(true); }
}

function handleFrame(frame, narr) {
  let event = 'message', data = '';
  for (const line of frame.split('\n')) {
    if (line.startsWith('event:')) event = line.slice(6).trim();
    else if (line.startsWith('data:')) data = line.slice(5).trim();
  }
  const p = data ? JSON.parse(data) : {};
  if (event === 'token') { narr.textContent += p.text; scroll(); }
  else if (event === 'correction') el('correction', p.text);
  else if (event === 'state') renderState(p);
}

document.getElementById('newBtn').addEventListener('click', openCreator);
document.getElementById('sheetBtn').addEventListener('click', () =>
  document.getElementById('sheet').classList.toggle('open'));
document.getElementById('form').addEventListener('submit', (e) => {
  e.preventDefault(); const t = input.value.trim();
  if (t) { input.value = ''; act(t); }
});

const saved = localStorage.getItem('hl_run');
if (saved) { loadState(saved).then(ok => { if (!ok) openCreator(); }); }
else openCreator();
</script>
</body>
</html>
