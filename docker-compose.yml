services:
  db:
    image: pgvector/pgvector:pg16
    container_name: halflight-db
    environment:
      POSTGRES_USER: halflight
      POSTGRES_PASSWORD: halflight
      POSTGRES_DB: halflight
    ports:
      - "5432:5432"
    volumes:
      - halflight-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U halflight"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  halflight-pgdata:
